<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4f46e5"/>
    </marker>
  </defs>
  <rect width="760" height="300" rx="14" fill="url(#bg)" stroke="#c7d2fe" stroke-width="1.5"/>
  <text x="28" y="36" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e293b">DITAEditor 结构：工作台 · 共享 XML 内核 · 服务端</text>

  <rect x="28" y="60" width="196" height="196" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="46" y="88" font-family="Inter, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#4338ca">Web 工作台</text>
  <text x="46" y="112" font-family="monospace" font-size="10.5" fill="#475569">React 19 + Vite</text>
  <text x="46" y="136" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#64748b">· 可视化编辑（结构化）</text>
  <text x="46" y="156" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#64748b">· 源码编辑（XML）</text>
  <text x="46" y="176" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#64748b">· Map 结构树编排</text>
  <text x="46" y="196" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#64748b">· 大纲、诊断与 AI 助手</text>
  <text x="46" y="228" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="#94a3b8">浏览器内实时结构约束</text>

  <rect x="252" y="60" width="196" height="196" rx="10" fill="#0f172a" stroke="#334155"/>
  <text x="270" y="88" font-family="Inter, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#38bdf8">共享 XML 内核</text>
  <text x="270" y="112" font-family="monospace" font-size="10.5" fill="#e2e8f0">@dita/core</text>
  <text x="270" y="136" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#94a3b8">· 无损解析与确定性序列化</text>
  <text x="270" y="156" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#94a3b8">· 元素模型与内容顺序</text>
  <text x="270" y="176" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#94a3b8">· 键空间、conref 解析</text>
  <text x="270" y="196" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#94a3b8">· CALS 表格适配</text>
  <text x="270" y="228" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="#64748b">浏览器与服务端同一份代码</text>

  <rect x="476" y="60" width="256" height="196" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="494" y="88" font-family="Inter, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#047857">服务端</text>
  <text x="494" y="112" font-family="monospace" font-size="10.5" fill="#475569">@dita/api · Fastify</text>
  <text x="494" y="136" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#64748b">· 手册、文件与资产</text>
  <text x="494" y="156" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#64748b">· 检出锁与个人草稿叠加层</text>
  <text x="494" y="176" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#64748b">· 语义索引与跨文件诊断</text>
  <text x="494" y="196" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#64748b">· DITA-OT 严格校验与发布</text>
  <text x="494" y="228" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="#94a3b8">Git worktree 隔离每个分支</text>

  <line x1="224" y1="158" x2="248" y2="158" stroke="#4f46e5" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="448" y1="158" x2="472" y2="158" stroke="#4f46e5" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
