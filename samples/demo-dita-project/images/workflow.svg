<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 220" width="780" height="220">
  <rect width="780" height="220" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="26" y="34" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f172a">同一份 XML：写作 → 复用 → 协作出栈 → 校验 → 发布</text>

  <rect x="26" y="58" width="134" height="104" rx="8" fill="#eef2ff" stroke="#818cf8"/>
  <text x="40" y="84" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#312e81">1. 写主题</text>
  <text x="40" y="108" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="#4338ca">concept / task</text>
  <text x="40" y="126" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="#4338ca">reference</text>
  <text x="40" y="148" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="#475569">可视化或源码</text>

  <rect x="180" y="58" width="134" height="104" rx="8" fill="#ecfdf5" stroke="#34d399"/>
  <text x="194" y="84" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#065f46">2. 复用与条件化</text>
  <text x="194" y="108" font-family="monospace" font-size="10" fill="#047857">conref / keyref</text>
  <text x="194" y="126" font-family="monospace" font-size="10" fill="#047857">ditaval</text>
  <text x="194" y="148" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="#475569">一处改，处处同步</text>

  <rect x="334" y="58" width="134" height="104" rx="8" fill="#fffbeb" stroke="#fbbf24"/>
  <text x="348" y="84" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#92400e">3. 检出与签入</text>
  <text x="348" y="108" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="#b45309">个人草稿叠加层</text>
  <text x="348" y="126" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="#b45309">独占检出锁</text>
  <text x="348" y="148" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="#475569">签入才动基线</text>

  <rect x="488" y="58" width="134" height="104" rx="8" fill="#eff6ff" stroke="#60a5fa"/>
  <text x="502" y="84" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af">4. 两层校验</text>
  <text x="502" y="108" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="#1d4ed8">实时结构提醒</text>
  <text x="502" y="126" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="#1d4ed8">DITA-OT 严格校验</text>
  <text x="502" y="148" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="#475569">带行内定位</text>

  <rect x="642" y="58" width="112" height="104" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="656" y="84" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f172a">5. 发布</text>
  <text x="656" y="108" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="#334155">HTML5 / PDF</text>
  <text x="656" y="126" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="#334155">主题与品牌</text>
  <text x="656" y="148" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="#475569">可下载 ZIP</text>

  <line x1="160" y1="110" x2="176" y2="110" stroke="#4f46e5" stroke-width="2"/>
  <line x1="314" y1="110" x2="330" y2="110" stroke="#4f46e5" stroke-width="2"/>
  <line x1="468" y1="110" x2="484" y2="110" stroke="#4f46e5" stroke-width="2"/>
  <line x1="622" y1="110" x2="638" y2="110" stroke="#4f46e5" stroke-width="2"/>
  <text x="26" y="190" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#64748b">每一次保存都只改动被编辑的那一行，因此 Git 差异小、评审易读、发布可复现。</text>
</svg>
