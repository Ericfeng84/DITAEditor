name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - 'apps/site/**'
      - 'packages/dita-core/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Defaults to the owning account's Pages origin; override with the `SITE_URL` repository variable
  # when a custom domain is attached.
  SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io', github.repository_owner) }}
  # GitHub Pages project sites are served from /<repo>/, so derive the base automatically.
  SITE_BASE: ${{ vars.SITE_BASE || (github.event.repository.name == format('{0}.github.io', github.repository_owner) && '/' || format('/{0}/', github.event.repository.name)) }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build @dita/core
        run: pnpm --filter @dita/core build

      - name: Build the static site
        run: pnpm --filter @dita/site build

      - name: Typecheck and test the site
        run: |
          pnpm --filter @dita/site typecheck
          pnpm --filter @dita/site test

      - name: Disable Jekyll processing
        run: touch apps/site/dist/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
