name: Deploy to Hugging Face Spaces

on:
  workflow_dispatch:
    inputs:
      space_repo:
        description: 'Target Space repo (<owner>/<space-name>); defaults to vars.HF_SPACE_REPO'
        required: false
        type: string
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: hf-space-deploy
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Hugging Face deployment configuration
        id: config
        env:
          INPUT_SPACE_REPO: ${{ inputs.space_repo }}
          VAR_SPACE_REPO: ${{ vars.HF_SPACE_REPO }}
          HAS_HF_TOKEN: ${{ secrets.HF_TOKEN != '' }}
        run: |
          SPACE_REPO="${INPUT_SPACE_REPO:-${VAR_SPACE_REPO}}"
          if [ -z "${SPACE_REPO}" ] || [ "${HAS_HF_TOKEN}" != "true" ]; then
            if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
              echo "::error::Missing HF_SPACE_REPO (repository variable or workflow input) or HF_TOKEN (repository secret)."
              exit 1
            fi
            echo "Skipping Hugging Face Spaces sync: HF_SPACE_REPO or HF_TOKEN is not configured."
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "space_repo=${SPACE_REPO}" >> "${GITHUB_OUTPUT}"
          echo "enabled=true" >> "${GITHUB_OUTPUT}"

      - name: Sync Docker bundle to Hugging Face Space
        if: steps.config.outputs.enabled == 'true'
        env:
          HF_SPACE_REPO: ${{ steps.config.outputs.space_repo }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ vars.HF_USERNAME }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          chmod +x scripts/sync-hf-space.sh
          ./scripts/sync-hf-space.sh
