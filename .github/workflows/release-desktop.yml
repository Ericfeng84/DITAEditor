name: Release Desktop

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional existing GitHub Release tag to attach installers to (leave empty for artifact-only dry run)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-desktop:
    name: Build desktop (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: mac-arm64
            script: dist:mac
          - os: windows-latest
            target: win-x64
            script: dist:win

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Resolve desktop version
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag || '' }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=" >> "$GITHUB_OUTPUT"
          fi

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workbench packages
        run: pnpm --filter @dita/core --filter @dita/web --filter @dita/api build

      - name: Package desktop installer (${{ matrix.target }})
        env:
          DESKTOP_VERSION: ${{ steps.version.outputs.version }}
          # Disable automatic signing discovery when no signing certificate secret is configured.
          # When CSC_LINK (macOS) or WIN_CSC_LINK (Windows) is provided, electron-builder signs automatically.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ (secrets.CSC_LINK != '' || secrets.WIN_CSC_LINK != '') && 'true' || 'false' }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm --filter @dita/desktop run ${{ matrix.script }}

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.exe
            apps/desktop/release/*.zip
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest*.yml
          if-no-files-found: error

  attach-to-release:
    name: Attach installers to GitHub Release
    needs: build-desktop
    if: github.event_name == 'release' || inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: List release assets
        run: ls -lh release-artifacts/

      - name: Upload installers to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || inputs.tag }}
          files: release-artifacts/*
